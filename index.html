<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Status</title>
<meta name="description" content="Status of my open-source pull requests: stage, CI, reviews and every comment in one place.">
<meta name="theme-color" content="#0a0a0b">
<script>(function(){try{var t=localStorage.getItem("prs.theme")||"dark";document.documentElement.setAttribute("data-theme",t);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==="light"?"#f6f8fc":"#0a0a0b";}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230a0a0b'/%3E%3Ccircle cx='11' cy='9' r='3' fill='none' stroke='%23ededee' stroke-width='2.4'/%3E%3Ccircle cx='11' cy='23' r='3' fill='none' stroke='%23ededee' stroke-width='2.4'/%3E%3Ccircle cx='22' cy='23' r='3' fill='none' stroke='%233ecf8e' stroke-width='2.4'/%3E%3Cpath d='M11 12v8M22 20v-6a3 3 0 0 0-3-3h-4' fill='none' stroke='%23ededee' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar">
    <div class="ws">
      <div class="ws-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="7" cy="6" r="2.4" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="7" cy="18" r="2.4" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="17" cy="18" r="2.4" fill="none" stroke="var(--accent)" stroke-width="1.9"/><path d="M7 8.4v7.2M17 15.6V11a3 3 0 0 0-3-3h-3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </div>
      <div class="ws-text"><span class="ws-name">PR Status</span><span class="ws-sub" id="ws-sub">Open-source pull requests</span></div>
      <button class="icon-button close-nav" id="close-nav" aria-label="Close menu"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <nav class="nav" id="nav" aria-label="Filter by who acts next"></nav>
    <div class="side-foot">
      <div class="sync" id="sync"><span class="sync-dot"></span><span id="updated">Loading…</span></div>
      <div class="side-actions">
        <button class="button button-text button-sm" id="refresh"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Reload</button>
        <button class="icon-button" id="theme" aria-label="Toggle theme" title="Toggle theme"></button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-button" id="open-nav" aria-label="Open menu"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <span class="topbar-brand">PR Status</span>
    </header>

    <main class="content" id="content">
      <div class="page-head">
        <div>
          <h1 id="view-title">All pull requests</h1>
          <p class="muted" id="view-sub"></p>
        </div>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="toolbar">
        <label class="search">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Search title, repo, issue or person" autocomplete="off">
          <kbd>/</kbd>
        </label>
      </div>
      <div class="dtable">
        <div class="dt-head" role="row">
          <span></span>
          <span class="th">Pull request</span>
          <span class="th">Stage</span>
          <span class="th">CI</span>
          <span class="th">Comments</span>
          <span class="th when">Activity</span>
        </div>
        <div class="dt-body" id="list"></div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="app.js"></script>
</body>
</html>
